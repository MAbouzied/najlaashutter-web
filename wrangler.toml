# Workers Builds (Git) — name must match the Worker in the dashboard.
name = "najlaashutter-web"
compatibility_date = "2024-09-01"
workers_dev = true

# Intercept the proxied production hosts before the former WordPress origin.
routes = [
  { pattern = "najlaashutter.com/*", zone_name = "najlaashutter.com" },
  { pattern = "www.najlaashutter.com/*", zone_name = "najlaashutter.com" },
  { pattern = "ads.najlaashutter.com/*", zone_name = "najlaashutter.com" }
]
main = "src/worker.ts"

# Astro static output + hostname-aware noindex on non-production hosts.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
