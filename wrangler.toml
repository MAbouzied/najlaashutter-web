# Workers Builds (Git) — name must match the Worker in the dashboard.
name = "najlaashutter-web"
compatibility_date = "2024-09-01"
workers_dev = true

# Static Astro output (no Worker script). Do not use pages_build_output_dir here.
[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
