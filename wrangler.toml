# Workers Builds (Git) — name must match the Worker in the dashboard.
name = "najlaashutter-web"
compatibility_date = "2024-09-01"
workers_dev = true
main = "src/worker.ts"

# Astro static output + hostname-aware noindex on non-production hosts.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
