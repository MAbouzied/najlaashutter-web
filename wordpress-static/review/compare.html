<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>مقارنة نسخة نجلاء شتر</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#eef2f6;color:#13304e}header{height:56px;padding:14px;display:flex;gap:14px;align-items:center}select{font:inherit;padding:5px}.grid{display:grid;grid-template-columns:1fr 1fr;direction:ltr;gap:2px}.column{overflow:hidden}h2{text-align:center;font:18px Arial;margin:0;padding:10px;background:white}iframe{display:block;border:0;background:white;transform-origin:top left}.mobile .grid{display:flex;justify-content:center;gap:40px}.mobile .column{width:390px}</style>
</head><body><header>مقارنة النسخة الثابتة بالموقع الأصلي <select id="route"><option value="/">الرئيسية</option><option value="/about-us/">من نحن</option><option value="/contact-us/">تواصل معنا</option><option value="/category/services/">الخدمات</option><option value="/window-shutters-with-remote-control/">خدمة</option><option value="/our-works/">أعمالنا</option><option value="/faq/">الأسئلة الشائعة</option><option value="/category/blog/">المدونة</option><option value="/how-do-you-choose-the-right-type-of-shutter-for-your-home/">مقال</option><option value="/privacy-policy/">الخصوصية</option></select><select id="size"><option value="desktop">كمبيوتر</option><option value="mobile">موبايل</option></select></header>
<div class="grid"><section class="column"><h2>الموقع الأصلي</h2><iframe id="original"></iframe></section><section class="column"><h2>النسخة الثابتة</h2><iframe id="replica"></iframe></section></div>
<script>const prefix="/MAbouzied/najlaashutter-web/replica-static-exact-2026-11-01/wordpress-static/review/";const current=new URL(location.hostname==='htmlpreview.github.io'?location.search.slice(1):location.href);const p=new URLSearchParams(current.search);const route=document.querySelector('#route'),size=document.querySelector('#size');const presets={faq:{route:'/faq/'},service:{route:'/window-shutters-with-remote-control/'},contact:{route:'/contact-us/'},blog:{route:'/category/blog/'},about:{route:'/about-us/'},gallery:{route:'/our-works/'},article:{route:'/how-do-you-choose-the-right-type-of-shutter-for-your-home/'},privacy:{route:'/privacy-policy/'},mobile:{size:'mobile'},'faq-mobile':{route:'/faq/',size:'mobile'}};const preset=presets[p.get('case')]||{};route.value=p.get('route')||preset.route||'/';size.value=p.get('size')||preset.size||'desktop';function draw(){const mobile=size.value==='mobile';document.body.className=mobile?'mobile':'';const w=mobile?390:1200;const scale=mobile?1:(innerWidth/2-1)/1200;for(const f of document.querySelectorAll('iframe')){f.style.width=w+'px';f.style.height=(mobile?1000:1900)+'px';f.style.transform='scale('+scale+')';}document.querySelector('#original').src='https://najlaashutter.com'+route.value;document.querySelector('#replica').src='https://htmlpreview.github.io/?https://raw.githubusercontent.com'+prefix+route.value.slice(1)+'index.html?v=4a7529e8f9e5';}route.onchange=size.onchange=draw;draw();</script></html>
