<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Replica browser verification</title>
<style>body{font:16px system-ui;margin:18px;background:#f4f5f6;color:#13304e}h1{font-size:24px}#status{font-weight:bold;font-size:22px}.pass{color:#087b3d}.fail{color:#b52d23}li{padding:3px}iframe{border:1px solid #aab;position:absolute;left:430px;top:16px;transform:scale(.60);transform-origin:top left;background:white}#results{width:390px}</style>
</head><body><h1>Najlaa static replica — actual browser QA</h1><p id="status">Loading…</p><p id="case"></p><ol id="results"></ol><iframe id="page"></iframe>
<script>
const prefix='/MAbouzied/najlaashutter-web/replica-static-exact-2026-11-01/wordpress-static/review/';
const current=new URL(location.hostname==='htmlpreview.github.io'?location.search.slice(1):location.href);
const params=new URLSearchParams(current.search);
const cases={mobile:{route:'/',width:390},faq:{route:'/faq/'},gallery:{route:'/our-works/'},service:{route:'/window-shutters-with-remote-control/'},search:{route:'/search/'},contact:{route:'/contact-us/'},blog:{route:'/category/blog/'}};
const selected=cases[params.get('case')]||{};
const route=params.get('route')||selected.route||'/';
const width=Number(params.get('width')||selected.width||1200);
const frame=document.querySelector('#page');
frame.style.width=width+'px';frame.style.height='1450px';
document.querySelector('#case').textContent=route+' — viewport '+width+' px — build 4a7529e8f9e5';
const results=[];
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const event=(element,name)=>new Promise(resolve=>{const timeout=setTimeout(()=>resolve(false),2500);element.addEventListener(name,()=>{clearTimeout(timeout);resolve(true);},{once:true});});
function check(name,ok,detail=''){results.push({name,ok,detail});const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name+(detail?' ('+detail+')':'');document.querySelector('#results').append(li);}
async function main(){
 const w=frame.contentWindow,d=w.document;
 await d.fonts.ready;
 await delay(200);
 check('RTL document',d.documentElement.dir==='rtl');
 check('Original font CSS',w.getComputedStyle(d.body).fontFamily.includes('Noto Kufi Arabic'));
 check('Stylesheets loaded',[...d.querySelectorAll('link[rel="stylesheet"]')].every(l=>Boolean(l.sheet)));
 check('Bootstrap loaded',Boolean(w.bootstrap?.Modal&&w.bootstrap?.Carousel));
 check('AOS loaded',Boolean(w.AOS));
 check('Fancybox loaded',Boolean(w.Fancybox));
 check('Swiper loaded',Boolean(w.Swiper));
 const visibleImages=[...d.images].filter(i=>i.getBoundingClientRect().width>0&&i.getBoundingClientRect().top<1450);
 check('Visible images loaded',visibleImages.every(i=>i.complete&&i.naturalWidth>0),visibleImages.length+' images');
 const mobile=d.querySelector('.pw-fixed-footer');
 check('Responsive contact bar',Boolean(mobile)&&(w.getComputedStyle(mobile).display!=='none')===(width<992));
 for(const id of ['pw-search-modal','pw-book-modal']){
  const el=d.getElementById(id);if(!el){check(id+' exists',false);continue;}
  const modal=w.bootstrap.Modal.getOrCreateInstance(el);const shown=event(el,'shown.bs.modal');modal.show();await shown;
  check(id+' opens',el.classList.contains('show'));const hidden=event(el,'hidden.bs.modal');modal.hide();await hidden;check(id+' closes',!el.classList.contains('show'));
 }
 const name=d.querySelector('#name-model'),message=d.querySelector('#message-model');
 if(name&&message){name.value='Replica QA';message.value='Preview only';name.dispatchEvent(new w.Event('keyup',{bubbles:true}));
  const href=d.querySelector('#wts-link-model')?.getAttribute('href')||'';
  check('Contact form builds WhatsApp URL',href.includes('966535344170')&&href.includes('Replica QA'));
 }
 const menu=d.getElementById('pw-side-menu');
 if(menu){const canvas=w.bootstrap.Offcanvas.getOrCreateInstance(menu);const shown=event(menu,'shown.bs.offcanvas');canvas.show();await shown;check('Mobile menu opens',menu.classList.contains('show'));const hidden=event(menu,'hidden.bs.offcanvas');canvas.hide();await hidden;check('Mobile menu closes',!menu.classList.contains('show'));}
 const hero=d.getElementById(width<992?'pwCarouselMob':'pwCarousel');
 if(hero){const slides=[...hero.querySelectorAll('.carousel-item')];const before=slides.findIndex(s=>s.classList.contains('active'));const instance=w.bootstrap.Carousel.getOrCreateInstance(hero);instance.pause();instance.next();await delay(750);const after=slides.findIndex(s=>s.classList.contains('active'));check('Hero changes slide',slides.length>1&&before!==after,slides.length+' slides');}
 const swipers=[...d.querySelectorAll('.swiper')].filter(el=>Boolean(el.swiper));
 if(route==='/')check('Original Swiper instances',swipers.length>=3,swipers.length+' instances');
 for(const el of swipers.slice(0,3)){const s=el.swiper;s.autoplay?.stop();s.slideTo(0,0);const before=s.activeIndex;s.slideNext(0);check('Swiper navigation '+el.className.split(' ').find(c=>c.startsWith('pw-hom-')),s.activeIndex!==before||s.slides.length<=s.params.slidesPerView);}
 const button=d.querySelector('.accordion-button');
 if(button){button.click();await delay(400);check('Homepage FAQ expands',button.getAttribute('aria-expanded')==='true');}
 if(route==='/faq/')check('Internal FAQ remains static',d.querySelectorAll('.post-content h3').length===10&&!d.querySelector('.post-content .accordion'));
 if(width<992&&menu){const toggle=menu.querySelector('.ox-btn');if(toggle){const sub=toggle.parentElement.querySelector('.sub-menu');const before=sub.classList.contains('d-none');toggle.click();check('Mobile services submenu toggles',before!==sub.classList.contains('d-none'));}}
 if(route==='/our-works/'){
  const link=d.querySelector('.wp-block-gallery a[data-fancybox]');
  if(link){link.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,view:w}));await delay(300);check('Gallery lightbox opens',Boolean(d.querySelector('.fancybox__container')));w.Fancybox.close();}
  else check('Gallery binding present',false);
 }
 if(route.startsWith('/search')){await delay(500);check('Static search returns results',d.querySelectorAll('div.pw-search.my-3').length>0);}
 const fail=results.filter(x=>!x.ok).length;const status=document.querySelector('#status');status.textContent=fail?'COMPLETE: '+fail+' failed':'COMPLETE: all '+results.length+' checks passed';status.className=fail?'fail':'pass';window.REPLICA_QA_RESULTS=results;
}
let started=false;
frame.onload=()=>{if(started||frame.contentDocument.documentElement.dataset.replicaReady!=='true')return;started=true;main().catch(e=>{document.querySelector('#status').textContent='ERROR: '+e.message;document.querySelector('#status').className='fail';});};
frame.src='https://htmlpreview.github.io/?https://raw.githubusercontent.com'+prefix+route.replace(/^\//,'')+'index.html'+(route.startsWith('/search')?'?s='+encodeURIComponent('شتر')+'&v=4a7529e8f9e5':'?v=4a7529e8f9e5');
</script></html>
